name: Provision Hashicorp Vault
on: [workflow_dispatch]
jobs:
  Vault:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: echo $PATH
      - name: Run Vault Setup
        run: ansible-playbook -i localhost, --connection=local, tool-setup.yml -e ansible_password=abc@1234 -e tool_name=vault