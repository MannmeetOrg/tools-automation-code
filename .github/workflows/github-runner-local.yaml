name: Provision Github-Runner
on: [workflow_dispatch]
jobs:
  Github-Runner:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: echo $PATH
      - name: Run Github-Runner Setup
        run: ansible-playbook -i localhost, --connection=local, tool-setup.yml -e ansible_password=abc@1234 -e tool_name=github-runner